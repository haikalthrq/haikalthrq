name: Refresh coding activity

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 1"

permissions:
  contents: write

concurrency:
  group: coding-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out profile
        uses: actions/checkout@v4

      - name: Validate activity generator
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate aggregate chart from owned repositories
        env:
          CODING_ACTIVITY_TOKEN: ${{ secrets.CODING_ACTIVITY_TOKEN }}
        run: python3 scripts/coding_activity.py

      - name: Commit only the aggregate SVG
        run: |
          git add -- assets/coding-activity.svg
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(profile): refresh coding activity"
            git push origin HEAD:main
          fi
