name: Test coding activity

on:
  push:
    paths:
      - "scripts/coding_activity.py"
      - "tests/test_coding_activity.py"
      - ".github/workflows/test-coding-activity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and offline tests
        run: |
          python3 -m py_compile scripts/coding_activity.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
